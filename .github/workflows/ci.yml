name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruby:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      BUNDLE_WITH: modern_development
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ['3.1', '3.4']

    steps:
      - uses: actions/checkout@v4

      - name: Install C libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libzstd-dev liblz4-dev libbrotli-dev

      - name: Install C libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd lz4 brotli

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Compile extension
        run: bundle exec rake compile

      - name: Run tests
        run: bundle exec rake test

      - name: Run demo
        run: ruby -I lib demo.rb

  mysql-e2e:
    name: MySQL 5.7 UDF e2e
    needs: ruby
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BUNDLE_WITH: modern_development
      MCDB_MYSQL_WAIT_SECONDS: '120'

    steps:
      - uses: actions/checkout@v4

      - name: Install MySQL-compatible headers and build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential default-libmysqlclient-dev
          test -f /usr/include/mysql/mysql.h
          docker version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Compile Ruby extension
        run: bundle exec rake compile

      - name: Run MySQL UDF end-to-end test
        run: bash mysql_udf/test/run_e2e.sh

  postgres-e2e:
    name: PostgreSQL 17 extension e2e
    needs: ruby
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUNDLE_WITH: modern_development
      MCDB_POSTGRES_WAIT_SECONDS: '120'
      MCDB_PG_CONFIG: /usr/lib/postgresql/17/bin/pg_config

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 development headers and build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates curl gnupg

          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | \
            sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg

          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | \
            sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null

          sudo apt-get update
          sudo apt-get install -y postgresql-server-dev-17
          test -x "$MCDB_PG_CONFIG"
          "$MCDB_PG_CONFIG" --version
          docker version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Compile Ruby extension
        run: bundle exec rake compile

      - name: Run PostgreSQL extension end-to-end test
        run: bash postgres_extension/test/run_e2e.sh
